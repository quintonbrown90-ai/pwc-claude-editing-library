<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(../fonts/Anton-Regular.ttf)}
@font-face{font-family:PoppinsX;src:url(../fonts/Poppins-ExtraBold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#card{position:absolute;left:70px;top:430px;width:940px;height:1060px;background:#07182F;border-radius:36px;border:3px solid rgba(20,168,134,.55);overflow:hidden;opacity:0}
#label{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-family:Anton;color:#fff;font-size:64px;letter-spacing:2px}
#label b{color:#FEE238}
</style></head><body>
<div id="card">
<svg width="940" height="1060" viewBox="0 0 940 1060">
  <g stroke="#12365E" stroke-width="16" stroke-linecap="round">
    <path d="M-20 210 H960"/><path d="M-20 470 H960"/><path d="M-20 730 H960"/><path d="M-20 950 H960"/>
    <path d="M170 -20 V1080"/><path d="M430 -20 V1080"/><path d="M690 -20 V1080"/>
  </g>
  <g stroke="#0D2748" stroke-width="8">
    <path d="M60 340 H880"/><path d="M300 -20 V1080"/><path d="M560 -20 V1080"/><path d="M-20 600 H960"/>
  </g>
  <g fill="#0E2C50"><rect x="185" y="40" width="225" height="150" rx="10"/><rect x="450" y="240" width="220" height="210" rx="10"/><rect x="710" y="500" width="200" height="210" rx="10"/><rect x="40" y="760" width="240" height="170" rx="10"/><rect x="450" y="760" width="220" height="170" rx="10"/></g>
  <path id="route" fill="none" stroke="#FEE238" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
        d="M120 880 L120 470 L430 470 L430 210 L760 210"/>
  <circle id="startDot" cx="120" cy="880" r="20" fill="#14A886" stroke="#fff" stroke-width="7"/>
  <g id="pin" opacity="0">
    <path d="M760 130 c-42 0 -66 30 -66 62 c0 44 66 108 66 108 s66 -64 66 -108 c0 -32 -24 -62 -66 -62z" fill="#FEE238" stroke="#00214E" stroke-width="6"/>
    <circle cx="760" cy="192" r="24" fill="#00214E"/>
  </g>
</svg>
<div id="label"></div>
</div>
<script>
// DATA: {from, to, dur} — route draws EASE IN-OUT, destination pin drops with OVERSHOOT.
const D = Object.assign({from:'POSTING FOR FREE', to:'THE STUDIO', dur:2.6}, window.DATA||{});
const E={ease_in:t=>t*t*t, ease_out:t=>1-Math.pow(1-t,3),
  ease_in_out:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  overshoot:t=>{const s=2.1;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)}};
const clamp=t=>Math.max(0,Math.min(1,t));
const card=document.getElementById('card'), route=document.getElementById('route'),
      pin=document.getElementById('pin'), label=document.getElementById('label');
const LEN=route.getTotalLength(); route.style.strokeDasharray=LEN;
label.innerHTML = D.from+' &nbsp;→&nbsp; <b>'+D.to+'</b>';
function render(t){
  const cin=E.ease_out(clamp(t/0.3)); card.style.opacity=cin;
  route.style.strokeDashoffset=LEN*(1-E.ease_in_out(clamp(t/D.dur)));
  const pp=E.overshoot(clamp((t-D.dur)/0.4));
  pin.style.opacity=t>D.dur?1:0;
  pin.style.transformOrigin='760px 300px';
  pin.style.transform=`translateY(${t>D.dur?(1-pp)*-46:0}px) scale(${t>D.dur?Math.max(.3,pp):1})`;
}
window.setT=ms=>render(ms/1000);
if(!window.__MANUAL){const t0=performance.now();(function loop(){render((performance.now()-t0)/1000);requestAnimationFrame(loop)})();}
</script></body></html>
