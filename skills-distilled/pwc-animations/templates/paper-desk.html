<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Caveat;src:url(../fonts/Caveat-Bold.ttf)}
@font-face{font-family:Anton;src:url(../fonts/Anton-Regular.ttf)}
@font-face{font-family:PoppinsX;src:url(../fonts/Poppins-ExtraBold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#desk{position:absolute;left:60px;top:380px;width:960px;height:1160px;border-radius:28px;background:linear-gradient(155deg,#0B2447,#061731);border:3px solid rgba(20,168,134,.5)}
.paper{position:absolute;width:600px;background:#FBF7EC;border-radius:8px;padding:36px 42px;color:#16324F;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.tape{position:absolute;top:-18px;left:50%;margin-left:-70px;width:140px;height:38px;background:rgba(254,226,56,.75);border-radius:3px;transform:rotate(-3deg)}
.paper h3{font-family:Anton;font-size:42px;letter-spacing:1px;margin-bottom:12px;color:#0A2A52}
.paper p{font-family:Caveat;font-size:47px;line-height:1.25}
.u{display:block;height:8px;background:#FEE238;border-radius:4px;margin-top:8px;transform-origin:left}
</style></head><body>
<div id="desk"></div>
<script>
// DATA: {papers:[{title, lines:[..], x, y, rot} x3]} — papers land OVERSHOOT, handwriting reveals in STEPS.
const D=Object.assign({papers:[
  {title:'REMEMBER', lines:['Most viewers decide in','the first 3 seconds.','Hook first. Always.'], x:70, y:470, rot:-3},
  {title:'THE RULE', lines:['Show it, don\u2019t say it.','Proof beats promises.'], x:360, y:830, rot:2.5},
  {title:'TODAY', lines:['One video. One keyword.','One next step.'], x:110, y:1180, rot:-1.5}]}, window.DATA||{});
const E={ease_out:t=>1-Math.pow(1-t,3),
  overshoot:t=>{const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)},
  steps:(t,n)=>t>=1?1:Math.floor(t*n)/n};
const clamp=t=>Math.max(0,Math.min(1,t));
const desk=document.getElementById('desk');
const els=D.papers.map((P,i)=>{
  const el=document.createElement('div'); el.className='paper';
  el.style.left=P.x+'px'; el.style.top=P.y+'px';
  el.innerHTML=`<div class="tape"></div><h3>${P.title}</h3>`+
    P.lines.map(l=>`<p>${l}</p>`).join('')+`<span class="u"></span>`;
  document.body.appendChild(el);
  return {el, rot:P.rot, ps:[...el.querySelectorAll('p')], u:el.querySelector('.u')};});
function render(t){
  desk.style.opacity=E.ease_out(clamp(t/0.3));
  els.forEach((o,i)=>{
    const p=E.overshoot(clamp((t-i*0.45)/0.45));
    o.el.style.opacity=t>i*0.45?1:0;
    o.el.style.transform=`rotate(${o.rot*p}deg) translateY(${(1-p)*-70}px) scale(${0.85+0.15*p})`;
    o.ps.forEach((el,j)=>{el.style.opacity=E.steps(clamp((t-i*0.45-0.4-j*0.16)/0.15),2);});
    o.u.style.transform=`scaleX(${E.ease_out(clamp((t-i*0.45-0.95)/0.3))}) rotate(${o.rot}deg)`;
  });
}
window.setT=ms=>render(ms/1000);
if(!window.__MANUAL){const t0=performance.now();(function loop(){render((performance.now()-t0)/1000);requestAnimationFrame(loop)})();}
</script></body></html>
